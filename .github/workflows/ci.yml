# Continuous integration for Fundamento (EF-7).
#
# Two independent jobs:
#   quality        lint, format, types and tests, from a clean checkout
#   runtime-image  builds the runtime image and checks its contract (D-010, D-011)
#
# A green run does NOT validate the full 331-article corpus. data/raw/ is not
# in git (D-002), so the tests marked "corpus" are skipped here, by design.

name: CI

on:
  push:
  pull_request:

# Both jobs only need to read the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Quality (ruff, mypy, pytest)
    # A fixed image rather than ubuntu-latest, which moves to new Ubuntu releases.
    runs-on: ubuntu-24.04
    # The tests marked "postgres" (T3, D-052) run against the same pinned image as
    # compose.yaml: pgvector 0.8.7 on PostgreSQL 18.6, by tag and digest. The database
    # lives only inside this job; its password is a throwaway, not a secret.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: fundamento
          POSTGRES_DB: fundamento
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fundamento -d fundamento"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.14"

      # Runtime packages plus dev tools, each pinned to one version with its
      # hashes. The runtime part is identical to requirements.lock.txt, which is
      # what the image installs, so CI tests the same versions the image runs.
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock.txt

      # `python -m` runs each tool from the interpreter set up above, never a
      # copy that happens to be on the runner's PATH.
      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: mypy
        run: python -m mypy ingest scripts tests

      # The tokenizer is a downloaded file, not a package: tiktoken fetches
      # cl100k_base the first time and keeps it in the directory that
      # ingest/chunks.py gives it, so both the key and the path come from there.
      # The key is the runner OS, the exact tiktoken version and the encoding,
      # because tiktoken pins the URL and the SHA-256 of every encoding in its own
      # source. Not the Python version: the cache holds a data file, not built
      # code. No restore-keys, so a cache saved for another tiktoken version is
      # never restored, and tiktoken checks the SHA-256 of whatever it reads anyway.
      - name: Tokenizer cache key and path
        id: tokenizer
        run: |
          python - >> "$GITHUB_OUTPUT" <<'EOF'
          import importlib.metadata
          from ingest.chunks import TOKENIZER, TOKENIZER_CACHE_DIR
          print(f"key=tiktoken-{importlib.metadata.version('tiktoken')}-{TOKENIZER}")
          print(f"path={TOKENIZER_CACHE_DIR}")
          EOF

      - name: Tokenizer cache (restored here, saved when the job succeeds)
        uses: actions/cache@v6
        with:
          path: ${{ steps.tokenizer.outputs.path }}
          key: ${{ runner.os }}-${{ steps.tokenizer.outputs.key }}

      # From the restored cache, or downloaded on a cold one. Here and not inside
      # the tests, so that a network failure stops one named step with one explicit
      # error. The timeout bounds a stalled download, since tiktoken sets none.
      - name: Load the tokenizer (downloads it only on a cold cache)
        timeout-minutes: 5
        run: python -c "from ingest.chunks import TOKENIZER, load_encoding; load_encoding(TOKENIZER)"

      # The tests marked "embedding_model" need torch, transformers and 2.2 GB of weights
      # (the optional 'embed' extra). CI installs neither, by design, and declares it here:
      # this is the only thing that skips them, and -rs prints why.
      - name: Tests (corpus-marked tests skip without data/raw/)
        env:
          FUNDAMENTO_EMBEDDING_MODEL: unsupported
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: fundamento
          PGDATABASE: fundamento
          PGPASSWORD: ci-throwaway
        run: python -m pytest -rs

  runtime-image:
    name: Runtime image (build and contract)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Always an explicit target (D-011): without one, docker builds the last stage.
      - name: Build the runtime image
        run: docker build --target runtime -t fundamento:ci .

      - name: Check the runtime image contract
        run: docker run --rm -i fundamento:ci python - < ci/check_runtime_image.py
